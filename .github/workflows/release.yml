name: Cross-platform Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immediately only after every platform build and checksum passes
        required: false
        default: false
        type: boolean
      probe-opencv:
        description: Optional exact OpenCV wheel version for a decode-only diagnosis instead of a build
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build_release.py"
      - "laserlab/font_*.py"
      - "laserlab/branding.py"
      - "laserlab/ocr_adapters.py"
      - "laserlab/cli.py"
      - "laserlab/diagnostics.py"
      - "laserlab/__init__.py"
      - "laserlab_launcher.py"
      - "laserlab_cli_launcher.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "assets/codeofreality/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build_release.py"
      - "laserlab/font_*.py"
      - "laserlab/branding.py"
      - "laserlab/ocr_adapters.py"
      - "laserlab/cli.py"
      - "laserlab/diagnostics.py"
      - "laserlab/__init__.py"
      - "laserlab_launcher.py"
      - "laserlab_cli_launcher.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "assets/codeofreality/**"
    tags:
      - "v*"

permissions:
  contents: read

# Superseded candidate builds for the same ref may stop; tag builds never cancel.
concurrency:
  group: native-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  codec-probe:
    if: inputs.probe-opencv != ''
    uses: ./.github/workflows/codec-compatibility.yml
    with:
      opencv-version: ${{ inputs.probe-opencv }}

  verify:
    name: Verify source
    if: inputs.probe-opencv == ''
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    outputs:
      prerelease: ${{ steps.bundle.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x86_64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Record OpenCV build configuration
        run: |
          python -c "import cv2; print(cv2.getBuildInformation(), flush=True)"

      - name: Verify source demo decoding
        run: |
          python laserlab_launcher.py --smoke-demo

      - name: Build and verify native bundle
        id: bundle
        run: python scripts/build_release.py --output-dir dist --target ${{ matrix.target }}

      - name: Verify native archive identity and seven bundled fonts
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import zipfile
          from pathlib import Path
          from laserlab import __version__
          from laserlab.branding import BRAND_FONT_VARIANTS

          target = os.environ["RELEASE_TARGET"]
          revision = os.environ["GITHUB_SHA"]
          ref = os.environ["GITHUB_REF"]
          tag = ref.removeprefix("refs/tags/") if ref.startswith("refs/tags/") else None
          identity = f"v{__version__}" if tag else f"v{__version__}-candidate-{revision[:12]}"
          expected_name = f"LaserLab-{identity}-{target}.zip"
          archives = list(Path("dist").glob(f"LaserLab-v*-{target}.zip"))
          assert len(archives) == 1 and archives[0].name == expected_name, archives
          channel = ("release" if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", __version__) else "prerelease") if tag else "candidate"
          archive_path = archives[0]
          digest = hashlib.sha256()
          with archive_path.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          sidecar = archive_path.with_suffix(".zip.sha256")
          assert sidecar.read_text(encoding="utf-8").strip() == f"{digest.hexdigest()}  {expected_name}", "Archive checksum mismatch"
          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              records = [name for name in names if name.endswith("/BUILD-INFO.json")]
              assert len(records) == 1, "Missing or duplicated BUILD-INFO.json"
              info = json.loads(archive.read(records[0]))
              assert info["source_revision"] == revision
              assert info["source_dirty"] is False
              assert info["version"] == __version__
              assert info["release_tag"] == tag
              assert info["build_channel"] == channel
              assert info["target"] == target
              assert info["bundled_codeofreality_font_count"] == 7
              assert info["font_redistribution_attested_by_release_builder"]
              base = records[0].rsplit("/", 1)[0] + "/fonts/"
              expected = {spec[1] for spec in BRAND_FONT_VARIANTS.values()}
              actual = {
                  name[len(base):] for name in names
                  if name.startswith(base) and name.lower().endswith((".ttf", ".otf"))
              }
              assert actual == expected, f"Unexpected {target} font files: {actual ^ expected}"
              assert base + "CODEOFREALITY-PERMISSION.txt" in names
          print(f"{channel} {target}: source, version, seven fonts and rights notice verified")
          PY

      - name: Verify extracted Linux dashboard on X11
        if: matrix.target == 'linux-x86_64'
        shell: bash
        working-directory: dist
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils libgl1 \
            libxcb-image0 libxcb-shape0 libxcb-render-util0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-xinerama0 libxkbcommon-x11-0 libxcb-xkb1
          archives=(LaserLab-v*-linux-x86_64.zip)
          test "${#archives[@]}" -eq 1
          extracted=$(mktemp -d)
          unzip -q "${archives[0]}" -d "$extracted"
          xvfb-run -a bash -e -c '
            ulimit -c 0
            cd "$RUNNER_TEMP"
            HOME=$(mktemp -d)
            export HOME QT_QPA_PLATFORM=xcb
            "$1" > "$HOME/laserlab-startup.log" 2>&1 &
            app_pid=$!
            trap '\''kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true'\'' EXIT
            for attempt in {1..30}; do
              if xwininfo -root -tree 2>/dev/null | grep -F "LaserLab Community Science"; then
                exit 0
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "$HOME/laserlab-startup.log"
            exit 1
          ' _ "$extracted/${archives[0]%.zip}/LaserLab"

      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: LaserLab-${{ matrix.target }}
          path: |
            dist/LaserLab-v*-${{ matrix.target }}.zip
            dist/LaserLab-v*-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Stage draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download native bundles
        uses: actions/download-artifact@v4
        with:
          pattern: LaserLab-*
          path: dist
          merge-multiple: true

      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check --strict *.sha256

      - name: Stage draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LaserLab-v*.zip
            dist/LaserLab-v*.zip.sha256
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          # Tag pushes still stage drafts; the authorized release-cut workflow
          # deliberately dispatches this build with publish=true.
          draft: ${{ inputs.publish != true }}
          generate_release_notes: true
