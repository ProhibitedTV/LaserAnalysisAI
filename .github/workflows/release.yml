name: Cross-platform Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    outputs:
      prerelease: ${{ steps.bundle.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x86_64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Verify source demo decoding
        run: |
          python -c "import cv2; print(cv2.getBuildInformation(), flush=True)"
          python laserlab_launcher.py --smoke-demo

      - name: Build and verify native bundle
        id: bundle
        run: python scripts/build_release.py --output-dir dist --target ${{ matrix.target }}

      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: LaserLab-${{ matrix.target }}
          path: |
            dist/LaserLab-v*-${{ matrix.target }}.zip
            dist/LaserLab-v*-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Stage draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download native bundles
        uses: actions/download-artifact@v4
        with:
          pattern: LaserLab-*
          path: dist
          merge-multiple: true

      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check --strict *.sha256

      - name: Stage draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LaserLab-v*.zip
            dist/LaserLab-v*.zip.sha256
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          draft: true
          generate_release_notes: true
